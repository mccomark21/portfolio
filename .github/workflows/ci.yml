name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 strips TypeScript types on import. validate-content.mjs reads
      # the schemas from src/lib/content/schemas.ts, so an older Node fails.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate:content

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # INCLUDE_PLACEHOLDERS stays unset here. A pull request that would put
      # fixture content on the live site fails at this step.
      - name: Check for placeholder content
        run: npm run check:placeholders
